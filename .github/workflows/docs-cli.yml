name: docs-cli

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phantom-commands:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fail on undocumented CLI subcommands
        run: bash scripts/check-phantom-commands.sh
