# Publishes n8n-nodes-valorbrain to npm, with npm provenance, when a tag n8n-v<version> is pushed.
# Copy this file to .github/workflows/n8n-publish.yml at the root of the hub to turn it on.
#
# n8n verifies a community node only when it is published from GitHub Actions with an npm
# provenance statement (required since 1 May 2026). The package lives in the n8n/ folder of the
# hub; package.json declares repository.directory = "n8n", and the n8n scanner finds the folder by
# the package name.
#
# Authentication to npm, two ways:
#   A. Trusted publishing (the normal way). On npmjs.com: package settings > Trusted Publisher >
#      GitHub Actions: owner ValorBrain, repository valorbrain-harness, workflow n8n-publish.yml,
#      environment empty. Do not set the NPM_TOKEN secret.
#   B. A granular access token, only for the first publish (the package does not exist on npm yet).
#      Save it as the NPM_TOKEN secret, publish, then set up A and delete the secret and the token.
# Both ways publish with provenance: it comes from the OIDC token of this job.

name: Publish n8n node

on:
  push:
    tags:
      - 'n8n-v*.*.*'

jobs:
  publish:
    name: Publish n8n-nodes-valorbrain to npm
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: n8n

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node 22.14 or later and npm 11.5.1 or later.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: n8n/package-lock.json

      - name: Update npm
        run: npm install --global npm@11

      - name: Check that the tag is the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "n8n-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME is not n8n-v$version (package.json)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Publish
        # In GitHub Actions, n8n-node release runs lint and build, then npm publish with
        # NPM_CONFIG_PROVENANCE=true. It does not tag or bump anything.
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
